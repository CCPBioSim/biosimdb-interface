name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coveralls:
    name: Build main coverage baseline
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: biosimdb_interface
      pre-test-command: |
        if [ ! -d biosim-schema ]; then
          curl -fsSL -o biosim-schema-artifacts.tar.gz \
            https://github.com/CCPBioSim/biosim-schema/releases/latest/download/biosim-schema-artifacts.tar.gz
          mkdir -p biosim-schema
          tar -xzf biosim-schema-artifacts.tar.gz -C biosim-schema
        fi
        export WEBFORM_SCHEMA_PATH="${GITHUB_WORKSPACE}/biosim-schema/project/schema_webformfields.json"
        export ENGINE_MAPPING_SCHEMA_PATH="${GITHUB_WORKSPACE}/biosim-schema/project/schema_enginemappings.json"
        export BIOSIM_SCHEMA_PATH="${GITHUB_WORKSPACE}/biosim-schema/biosim_schema/schema/biosim_schema.yaml"
        export SECRET_KEY=ci-testing-only-key
