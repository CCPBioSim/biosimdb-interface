version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
      pre_build:
        - sphinx-apidoc --force -o docs/source/api_generated biosimdb_interface

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
